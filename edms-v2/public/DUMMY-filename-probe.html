<!doctype html><html lang="id"><meta charset="utf-8"><title>DUMMY Pemeriksaan nama file</title><main><h1>DUMMY Pemeriksaan nama file</h1><p>Uji sintetis pemilihan file. Halaman ini tidak mengirim isi file atau membuat dokumen di database.</p><label>Pilih PDF DUMMY<input type="file" accept=".pdf"></label><h2>Nama yang diterima browser</h2><pre id="result">Belum dipilih</pre><script>document.querySelector('input').addEventListener('change',e=>{const f=e.target.files[0];document.getElementById('result').textContent=f?JSON.stringify({name:f.name,size:f.size,type:f.type},null,2):'Belum dipilih';});</script></main></html>
